# ⚠️ 주의: 공통 앵커 설정 (들여쓰기 없음)
x-nautobot-base: &nautobot-base
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    - NAUTOBOT_DB_HOST=db
    - NAUTOBOT_DB_NAME=nautobot
    - NAUTOBOT_DB_USER=nautobot
    - NAUTOBOT_DB_PASSWORD=nautobotsecurepwd
    - NAUTOBOT_REDIS_HOST=redis
    - NAUTOBOT_SECRET_KEY=PleaseGenerateAUniqueSecureKeyForProduction123!
    - NAUTOBOT_ALLOWED_HOSTS=*
    - NAUTOBOT_CREATE_SUPERUSER=true
    - NAUTOBOT_SUPERUSER_NAME=admin
    - NAUTOBOT_SUPERUSER_PASSWORD=admin
    - NAUTOBOT_SUPERUSER_EMAIL=admin@example.com
    - NAUTOBOT_SUPERUSER_API_TOKEN=0123456789abcdef0123456789abcdef01234567
    - NAPALM_USERNAME=admin
    - NAPALM_PASSWORD=admin
    - DEVICE_SECRET=admin
    - CISCO_USER=admin
    - CISCO_PASSWORD=admin
  volumes:
    - ./nautobot_config.py:/opt/nautobot/nautobot_config.py:ro
    - ./git_repos:/opt/nautobot/git_repos
  depends_on:
    - db
    - redis

# ⚠️ 주의: 서비스 정의 구역 (들여쓰기 없음)
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nautobot
      POSTGRES_USER: nautobot
      POSTGRES_PASSWORD: nautobotsecurepwd
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  nautobot:
    <<: *nautobot-base
    ports:
      - "8888:8080"

  nautobot-worker:
    <<: *nautobot-base
    entrypoint: "nautobot-server celery worker"

  nautobot-scheduler:
    <<: *nautobot-base
    entrypoint: "nautobot-server celery beat"

volumes:
  pgdata:

